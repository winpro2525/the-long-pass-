<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الإعلانات | THE LONG PASS</title>
<meta name="description" content="THE LONG PASS — منطقة الطلاب التعليمية">
<meta name="theme-color" content="#090b0e">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>(function(){try{var t=localStorage.getItem('tlp-theme');if(!t)t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="ann">
<div id="toasts"></div>
<!-- ======================= الإعلانات ======================= -->
    <section id="ann" class="max-w-6xl mx-auto px-3 pt-10">
        <div class="section-head">
            <div class="kicker">// الإعلانات</div>
            <h2 class="h2">📣 الإعلانات والأخبار</h2>
            <div class="rule"></div>
        </div>
        <div id="ann-admin-box" class="frame p-4 mb-5 hidden">
            <h3 class="font-black text-sm mb-3">➕ نشر إعلان جديد</h3>
            <form id="ann-form" class="space-y-3">
                <div><label class="label">عنوان الإعلان *</label><input type="text" id="an-title" required maxlength="160" class="field"></div>
                <div><label class="label">النص</label><textarea id="an-content" rows="3" class="field" maxlength="2000"></textarea></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="md:col-span-2"><label class="label">صورة الإعلان</label><input type="file" id="an-image" accept="image/*" class="field text-xs"><img id="an-image-preview" class="hidden mt-2 max-h-24 border" style="border-color: var(--border)" alt=""></div>
                    <div><label class="label">رقم الملف المرتبط</label><input type="text" id="an-fileno" dir="ltr" class="field" placeholder="مثال: 27"></div>
                </div>
                <label class="flex items-center gap-2 text-sm font-bold"><input type="checkbox" id="an-pinned"> 📌 تثبيت في الأعلى</label>
                <button type="submit" id="an-submit" class="btn btn-gold w-full py-2.5">نشر الإعلان</button>
                <p id="an-status" class="text-center text-xs gold font-bold min-h-[1rem]"></p>
            </form>
        </div>
        <div id="ann-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    

<script src="assets/app.js"></script>
</body>
</html>
