<body data-page="hall">
<div id="toasts"></div>
<!-- ======================= قاعة المشاهير ======================= -->
    <section id="hall" class="max-w-4xl mx-auto px-3 pt-12">
        <div class="section-head">
            <div class="kicker">// لوحة الشرف</div>
            <h2 class="h2">🏆 لوحة الشرف</h2>

        <div id="award-banner" class="frame hall champ p-5 mb-6 relative hide">

            <div class="relative flex items-center gap-4">
                <div class="text-5xl"><span class="crown">🏆</span></div>

                    <p class="muted text-sm mt-1" id="award-note"></p>

            </div>
        </div>

        <div id="podium-note" class="muted text-xs text-center mb-3 hide">لم يحدد الأدمن أفضل ثلاثة بعد.</div>
        <div id="podium" class="podium mb-5"></div>
