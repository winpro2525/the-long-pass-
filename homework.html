<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الواجبات | THE LONG PASS</title>
<meta name="description" content="THE LONG PASS — منطقة الطلاب التعليمية">
<meta name="theme-color" content="#090b0e">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>(function(){try{var t=localStorage.getItem('tlp-theme');if(!t)t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="homework">
<div id="toasts"></div>

<main class="page-wrap" style="padding:24px 12px 40px">
    <div class="page-head">
        <div class="kicker">// الرفعات</div>
        <h1 class="h2">📥 رفع الواجبات والحلول</h1>
        <p class="muted text-sm">ارفع واجبك أو حلك لأي امتحان — أي صيغة ملف مقبولة (حتى 10 ميغابايت).</p>
    </div>

    <div id="subs-login-hint" class="frame p-6 text-center">
        <p class="muted text-sm mb-3">سجّل الدخول لرفع ملفاتك.</p>
        <button type="button" id="hw-join" class="btn btn-gold">دخول / تسجيل</button>
    </div>

    <div id="sub-form-wrap" class="frame p-4 mb-5 hidden">
        <h2 class="font-black text-sm mb-3">➕ رفع جديد</h2>
        <form id="sub-form" class="space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div><label class="label">النوع</label>
                    <select id="sub-kind" class="field"><option value="homework">واجب</option><option value="exam">امتحان محلول</option></select>
                </div>
                <div class="md:col-span-2"><label class="label">العنوان *</label><input id="sub-title" class="field" required maxlength="140"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div><label class="label">المادة / الدرس</label><input id="sub-subject" class="field" maxlength="140"></div>
                <div><label class="label">امتحان مرتبط (اختياري)</label><select id="hw-exam" class="field"><option value="">— بدون ربط —</option></select></div>
            </div>
            <div><label class="label">الملف *</label><input id="sub-file" type="file" class="field text-xs" required></div>
            <div><label class="label">ملاحظة</label><textarea id="sub-note" rows="2" class="field" maxlength="500"></textarea></div>
            <button type="submit" id="sub-submit" class="btn btn-gold w-full py-2.5">رفع</button>
            <p id="sub-status" class="text-center text-xs gold font-bold min-h-[1rem]"></p>
        </form>
    </div>

    <div id="subs-list" class="flex flex-col gap-2"></div>
</main>

<script src="assets/app.js"></script>
</body>
</html>
