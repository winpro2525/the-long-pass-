<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النتائج | THE LONG PASS</title>
<meta name="description" content="THE LONG PASS — منطقة الطلاب التعليمية">
<meta name="theme-color" content="#090b0e">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>(function(){try{var t=localStorage.getItem('tlp-theme');if(!t)t='dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="results">
<div id="toasts"></div>

<main class="page-wrap" style="padding:24px 12px 40px">
    <div class="page-head">
        <div class="kicker">// النتائج</div>
        <h1 class="h2">📊 النتائج</h1>
        <p class="muted text-sm">نتائج الامتحانات والواجبات والحلول مع تقييم المجهود.</p>
    </div>

    <div id="result-admin-box" class="frame p-4 mb-5 hidden">
        <h2 class="font-black text-sm mb-3">➕ إضافة نتيجة</h2>
        <form id="result-form" class="space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div><label class="label">النوع</label>
                    <select id="rs-kind" class="field"><option value="exam">امتحان</option><option value="homework">واجب</option><option value="solution">حل</option></select>
                </div>
                <div class="md:col-span-2"><label class="label">اسم الامتحان / الواجب *</label><input id="rs-title" class="field" required maxlength="140"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div><label class="label">الطالب *</label><select id="rs-student" class="field"></select></div>
                <div><label class="label">المادة</label><input id="rs-subject" class="field" maxlength="140"></div>
                <div><label class="label">تقييم المجهود</label>
                    <select id="rs-effort" class="field"><option value="">—</option><option>جيد</option><option>متوسط</option><option>رديء</option></select>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div><label class="label">النقطة</label><input id="rs-score" type="number" min="0" step="0.25" class="field"></div>
                <div><label class="label">الدرجة من</label>
                    <select id="rs-max" class="field"><option value="20">من 20</option><option value="10">من 10</option><option value="5">من 5</option></select>
                </div>
                <div><label class="label">ملاحظة</label><input id="rs-note" class="field" maxlength="200"></div>
            </div>
            <button type="submit" id="result-submit" class="btn btn-gold w-full py-2.5">إضافة النتيجة</button>
            <p id="result-status" class="text-center text-xs gold font-bold min-h-[1rem]"></p>
        </form>
    </div>

    <div class="flex flex-wrap justify-center gap-2 mb-4">
        <button type="button" data-rfilter="ALL" class="btn btn-sm btn-gold">الكل</button>
        <button type="button" data-rfilter="exam" class="btn btn-sm btn-soft">📝 امتحانات</button>
        <button type="button" data-rfilter="homework" class="btn btn-sm btn-soft">📒 واجبات</button>
        <button type="button" data-rfilter="solution" class="btn btn-sm btn-soft">✍️ حلول</button>
    </div>
    <div id="results-list" class="flex flex-col gap-2"></div>
</main>

<script src="assets/app.js"></script>
</body>
</html>
